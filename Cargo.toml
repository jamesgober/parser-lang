# =============================================================================
#  R E P S   ·   parser-lang
# =============================================================================
[package]
name    = "parser-lang"
version = "1.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Recursive-descent + Pratt parser infrastructure with error recovery."

# Keywords (5 max)
keywords = ["compiler", "parser", "language", "pratt"]

# Categories
categories = ["development-tools", "parser-implementations"]

# Links
homepage      = "https://github.com/jamesgober/parser-lang"
repository    = "https://github.com/jamesgober/parser-lang"
documentation = "https://docs.rs/parser-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "parser_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = ["token-lang/std", "diag-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The token stream a parser consumes: a kind paired with its span.
token-lang = { version = "1", default-features = false }
# Rich, source-annotated diagnostics the parser emits during error recovery.
diag-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
